{{- $strategy := include "msp-demo.strategy" . -}}
{{- if and (eq $strategy "blueGreen") .Values.previewIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "msp-demo.previewServiceName" . }}
  labels:
    {{- include "msp-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview
  {{- with .Values.previewIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.previewIngress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.previewIngress.host | quote }}
      secretName: {{ .Values.previewIngress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.previewIngress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "msp-demo.previewServiceName" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
