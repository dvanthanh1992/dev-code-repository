{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "msp-demo.redisFullname" . }}
  labels:
    {{- include "msp-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "msp-demo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
