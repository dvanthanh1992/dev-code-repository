{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "msp-demo.redisFullname" . }}
  labels:
    {{- include "msp-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "msp-demo.redisFullname" . }}
  replicas: 1
  {{- if .Values.redis.persistence.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- end }}
  selector:
    matchLabels:
      {{- include "msp-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "msp-demo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
              protocol: TCP
          {{- if .Values.redis.auth.enabled }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "msp-demo.redisSecretName" . }}
                  key: {{ .Values.redis.auth.passwordKey }}
          {{- end }}
          command:
            - sh
            - -ec
          args:
            - >-
              exec redis-server
              --port {{ .Values.redis.port }}
              --appendonly yes
              --appendfsync everysec
              --dir /data
              {{- if .Values.redis.auth.enabled }}
              --requirepass "$REDIS_PASSWORD"
              {{- end }}
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  redis-cli -p {{ .Values.redis.port }}
                  {{- if .Values.redis.auth.enabled }} -a "$REDIS_PASSWORD" --no-auth-warning{{- end }}
                  ping | grep -q PONG
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  redis-cli -p {{ .Values.redis.port }}
                  {{- if .Values.redis.auth.enabled }} -a "$REDIS_PASSWORD" --no-auth-warning{{- end }}
                  ping | grep -q PONG
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if .Values.redis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "msp-demo.labels" . | nindent 10 }}
          app.kubernetes.io/component: redis
      spec:
        accessModes:
          {{- toYaml .Values.redis.persistence.accessModes | nindent 10 }}
        {{- if .Values.redis.persistence.storageClass }}
        storageClassName: {{ .Values.redis.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
  {{- else }}
      volumes:
        - name: data
          emptyDir: {}
  {{- end }}
{{- end }}
