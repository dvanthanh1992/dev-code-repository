{{- $strategy := include "msp-demo.strategy" . -}}
{{- if eq $strategy "blueGreen" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "msp-demo.previewServiceName" . }}
  labels:
    {{- include "msp-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "msp-demo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
{{- end }}
